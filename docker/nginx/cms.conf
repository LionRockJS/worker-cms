# nginx in front of the CMS container (compose.yaml publishes it on 127.0.0.1:8787).
# Start the container with BASE_URL set to the https origin served here:
#   BASE_URL=https://cms.local docker compose up -d
# For another host, change server_name, the redirect and the certificate paths.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name cms.local;
    return 301 https://cms.local$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cms.local;

    ssl_certificate     /etc/ssl/certs/cms.local.crt;
    ssl_certificate_key /etc/ssl/private/cms.local.key;

    # Media uploads are capped at 25 MB by the CMS itself.
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Rate limits and the audit log key on this header; overwrite any value
        # the client sent so it cannot pick its own IP.
        proxy_set_header CF-Connecting-IP $remote_addr;

        # The page editor syncs over a websocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
