# Run the published image (.github/workflows/docker.yml builds it):
#   BASE_URL=https://cms.example.com docker compose pull && docker compose up -d
# or build it from this checkout instead:
#   BASE_URL=https://cms.example.com docker compose up -d --build
# CMS_TAG picks the image tag: development (default), latest (the main branch)
# or a fixed sha-<commit>. CMS_RUNTIME=workerd serves on plain workerd without
# Node (about 220 MiB less, no Images transforms); the default is miniflare.
# Secrets (JWT_SECRET, *_CLIENT_SECRET, ...) go in cms.env, which is gitignored:
#   cp cms.env.example cms.env
services:
  cms:
    build: .
    image: ghcr.io/lionrockjs/0xcms:${CMS_TAG:-development}
    restart: unless-stopped
    # Hard memory cap: past it the kernel kills the CMS and the restart policy
    # starts it again. docker/memory-check.sh restarts the workerd runtime in
    # place well before (720 MiB by default); this catches growth between its
    # checks and in the Node process, which that restart does not free.
    mem_limit: ${CMS_MEMORY_LIMIT:-1g}
    memswap_limit: ${CMS_MEMORY_LIMIT:-1g}
    # Loopback only: the reverse proxy on this host is the way in. Docker's
    # published ports bypass the host firewall.
    ports:
      - "127.0.0.1:${CMS_PORT:-8787}:8787"
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8787}
      CMS_RUNTIME: ${CMS_RUNTIME:-miniflare}
    env_file: cms.env
    volumes:
      - cms-state:/app/.wrangler/state

volumes:
  cms-state:
