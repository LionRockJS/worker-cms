# Static analysis (A.8.8). Findings land in the repository's Security tab;
# someone has to own triage for this to be a control rather than a report.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Catches advisories published after a change merged.
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
