# The gate for every change. `npm test` is deliberately the whole verification
# surface: it builds (pretest), then runs the profile, boundary, generated,
# inventory and security-requirements checks before vitest, so a stale
# generated registry, a broken feature boundary or a deleted security test
# fails here rather than at deploy. docker.yml calls this workflow too, so no
# image is published from a commit that fails it.
#
# Actions are pinned to full commit SHAs (W14); Dependabot's github-actions
# updates move the pin and its version comment together.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run type-check
      # No .dev.vars in CI: test bindings come from vitest.config.mts.
      - run: npm test
      - run: npm run check:dms-profile

  # An existing database upgraded through numbered migrations must end where a
  # fresh install does. --from is the oldest schema still deployed anywhere;
  # acc57d7 is the last revision with hand-applied migrations; a database whose
  # schema is older must be recreated or patched by hand. Move it forward only
  # when no deployment is older.
  upgrade-path:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm run check:upgrade -- --from acc57d7

  # High and critical findings in production dependencies block CI.
  # Record findings that require an exception under the W14 procedure.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
