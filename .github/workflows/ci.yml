# The gate for every change. `npm test` is deliberately the whole verification
# surface: it builds (pretest), then runs the profile, boundary, generated,
# inventory and security-requirements checks before vitest, so a stale
# generated registry, a broken feature boundary or a deleted security test
# fails here rather than at deploy.
#
# Actions are pinned to full commit SHAs (W14); Dependabot's github-actions
# updates move the pin and its version comment together.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run type-check
      # No .dev.vars in CI: test bindings come from vitest.config.mts.
      - run: npm test

  # An existing database upgraded through numbered and manual migrations must
  # end where a fresh install does. --from is the oldest revision still
  # deployed anywhere; f9719a3 predates every manual migration. Move it forward
  # only when no deployment is older (W0 records the deployed revisions).
  upgrade-path:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm run check:upgrade -- --from f9719a3

  # Blocking since W14: the backlog was empty (npm audit: 0 vulnerabilities on
  # 4 November 2026), so any high or critical advisory is a new finding. A
  # finding that cannot be fixed at once is triaged and recorded as a dated,
  # owned exception in the W14 record, never by turning this back off.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
